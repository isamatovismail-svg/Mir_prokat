<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в панель управления — Mir Prokat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-stone-900 text-stone-100 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-stone-800/90 border border-stone-700/80 rounded-3xl p-8 shadow-2xl backdrop-blur">
        <div class="text-center mb-8">
            <div class="w-12 h-12 rounded-2xl bg-amber-500 text-stone-950 flex items-center justify-center font-bold text-2xl mx-auto mb-3">
                M
            </div>
            <h1 class="text-2xl font-bold text-white tracking-tight">MIR PROKAT</h1>
            <p class="text-xs text-stone-400 mt-1 uppercase tracking-widest font-semibold">Вход в панель управления</p>
        </div>

        {% if error %}
        <div class="p-3.5 mb-6 rounded-xl bg-rose-500/20 border border-rose-500/40 text-rose-300 text-xs text-center font-medium">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-stone-300 mb-1.5">Логин администратора</label>
                <input type="text" name="username" required value="admin" class="w-full py-3 px-4 rounded-xl bg-stone-900/80 border border-stone-700 text-white text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-stone-300 mb-1.5">Пароль</label>
                <input type="password" name="password" required value="admin123" class="w-full py-3 px-4 rounded-xl bg-stone-900/80 border border-stone-700 text-white text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
            </div>

            <button type="submit" class="w-full py-3.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-stone-950 font-bold text-sm transition shadow-lg mt-2">
                Войти в систему
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-stone-700/60 text-center text-xs text-stone-400">
            <a href="{% url 'catalog:home' %}" class="hover:text-amber-400 transition">← Вернуться на клиентский сайт</a>
        </div>
    </div>

</body>
</html>
